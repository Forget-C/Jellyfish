<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jellyfish · 场次试拍</title><meta name="description" content="Jellyfish 场次试拍交互设计预览。调整方向、预览修改、采用复检。"><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><a class="brand" href="./" aria-label="Jellyfish 首页"><span class="brand-mark">J</span>Jellyfish</a><span class="breadcrumb">夜归<span>/</span>第三场 · 门外</span><span class="prototype">设计预览 · 示例数据</span><button class="avatar" id="about" aria-label="关于此预览">?</button></header>
<div class="workspace">
<aside class="sidebar"><div class="project-label">场次工作台<span>03</span></div><div class="phase-nav" aria-label="工作阶段"><button data-phase="design">导演设计</button><button class="selected" data-phase="shoot">单元试拍<span>3</span></button><button data-phase="edit">剪辑验收</button></div><div class="section-label">拍摄单元 <span>3 个</span></div><nav id="units" aria-label="选择拍摄单元"></nav><div class="sidebar-bottom"><span class="small-label">本场目标</span><p>在推门之前，<br>让犹豫先发生。</p><span class="muted">夜晚 · 室内外 · 18 秒</span></div></aside>
<main>
<header class="scene-heading"><div><span class="eyebrow" id="unit-number">单元 02 / 03</span><h1 id="unit-title">门口停顿</h1><p id="unit-description">她听见屋内的声音，手停在门把手前。</p></div><button class="quiet" id="history">历史记录 <span id="version">v1</span></button></header>
<nav class="workflow" aria-label="试拍步骤"><button data-step="prepare"><span class="step-number">✓</span>拍摄准备</button><span class="line"></span><button data-step="instruction" aria-current="step"><span class="step-number">2</span>调整与检查</button><span class="line"></span><button data-step="results"><span class="step-number">3</span>试拍结果</button></nav>
<div class="settings-strip"><span><span class="tiny-label">模型</span><strong id="model-label">视频模型 A</strong></span><span><span class="tiny-label">时长</span><strong id="duration-label">6 秒</strong></span><span><span class="tiny-label">画幅</span><strong id="ratio-label">16:9</strong></span><button class="text-button" id="settings">拍摄设置 <span aria-hidden="true">↗</span></button></div>
<div id="content"></div>
<footer class="page-footer"><span>当前单元的修改不会覆盖已有视频</span><span>JELLYFISH STUDIO</span></footer>
</main></div>
<dialog id="modal" aria-labelledby="modal-title"><div class="modal-header"><h2 id="modal-title"></h2><button id="close-modal" class="icon-button" aria-label="关闭弹窗">×</button></div><div id="modal-body"></div></dialog><div id="toast" class="toast" role="status" hidden></div>
