<section class="jf-section jf-workflow" aria-labelledby="workflow-title">
  <div class="jf-heading"><div class="jf-kicker">创作，有章可循</div><h2 id="workflow-title">一条连贯的短剧制作流程。</h2></div>
  <ol class="jf-process">
    {{ range $index, $step := site.Data.homepage.workflow }}
      <li><div class="jf-kicker">0{{ add $index 1 }} / {{ .title }}</div><h3>{{ .subtitle }}</h3><p>{{ .description }}</p></li>
    {{ end }}
  </ol>
  <a class="jf-detail-link" href="{{ "product/workflow/" | relURL }}">看《雾海来信》的创作流程 <span aria-hidden="true">↗</span></a>
</section>
