hero:
  title: "让故事，走向画面。"
  subtitle: "Jellyfish AI 短剧创作工作台，从剧本、参考素材到分镜与画面生成。"
showcase:
  - title: "分镜画布"
    image: "images/screenshots/home/storyboard.webp"
    alt: "海边站台的分镜画布，包含固定原文、人物与场景参考图、镜头描述和图片模型卡"
    description: "在一张画布上组织镜头描述、参考素材和生成任务。"
  - title: "场次划分"
    image: "images/screenshots/home/scene-division.webp"
    alt: "第一集《末班车之后》的章节原文和海边站台、堤岸晨光两个场次"
    description: "从章节原文选定范围，将故事拆成可制作的场次。"
  - title: "对象参考"
    image: "images/screenshots/home/object-references.webp"
    alt: "海边站台场次中已选用参考图的角色林夏、海边站台和旧信封"
    description: "为同一场次选用角色、场所和道具的参考图。"
  - title: "生成结果"
    image: "images/screenshots/home/generation-preview.webp"
    alt: "画布中的图片生成结果预览，林夏在站台灯下打开旧信封"
    description: "在画布中查看镜头的图片输出。"
  - title: "对话式生成"
    image: "images/screenshots/home/conversation.webp"
    alt: "文本实验室的两轮对话：先将站台开场拆成三个无对白镜头，再改写林夏认出字迹的特写"
    description: "先把站台开场拆成三个镜头，再追问一句，让林夏用一个动作认出旧信。"
workflow:
  - title: "构思"
    subtitle: "组织故事与镜头"
    description: "从章节原文开始，确认场次与导演设计。"
  - title: "制作"
    subtitle: "准备资产，生成候选"
    description: "把角色、场景与参考素材带进创作。"
  - title: "完成"
    subtitle: "检查生成结果"
    description: "预览输出，选用合适的素材继续创作。"
projects:
  - title: "雾海来信"
    genre: "海滨悬疑"
    cover: "images/projects/sea-letter.webp"
    synopsis: "末班车开走后，林夏在站台捡到一封旧信。信封上，是她认得的笔迹。"
  - title: "山海之间"
    genre: "古装冒险"
    cover: "images/projects/mountain-pass.webp"
    synopsis: "山洪冲断驿道，年轻驿卒循着父亲留下的舆图，寻找通往海港的最后一条山路。"
  - title: "第七次日出"
    genre: "科幻悬疑"
    cover: "images/projects/seventh-dawn.webp"
    synopsis: "连续六个清晨，山顶观测站都收到了明天的天气报告。第七天，电台里传来值班员自己的呼救声。"
